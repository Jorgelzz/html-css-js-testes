<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Panel: 3D Persianas Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fundo estático de destino (revelado ao final do flip) -->
  <div class="portfolio-bg" id="portfolioBg">
    <div class="portfolio-content">
      <h1 class="portfolio-name">Jorge Luiz</h1>
      <div class="portfolio-role">
        <span>Software Engineer</span>
      </div>
    </div>
  </div>

  <!-- Container onde as colunas 3D são injetadas -->
  <div id="container" class="container"></div>

  <!-- Botão para testar/reiniciar a animação -->
  <button id="replayBtn" class="btn-replay" aria-label="Reiniciar Animação">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
    </svg>
    Replay
  </button>

  <script src="script.js"></script>
</body>
</html>
